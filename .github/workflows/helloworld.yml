  name: Hello-world
  on: push

  jobs: 
      hello-world-job:
         runs-on: ubuntu-latest

         steps:
            - name: check out repository code
              uses: actions/checkout@v4
            - name: name: Setup Python
              uses: actions/setup-python@v5
              with :
                  python-version: '3.12'
             - name: Run python file
               run: python hello-world.py
            
  
